<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportes de becas | UDH Becas y Bienestar</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
  <script src="../js/theme.js"></script>
</head>
<body data-page="reportesbecas" data-title="Reportes de becas" data-section="Becas"
      data-description="Vistas y procedimientos de la base de datos: cupos, becas otorgadas y ranking.">
  <main>
    <div class="grid-2">
      <div class="card-app">
        <div class="card-app-header"><h2>Cupos y postulaciones por convocatoria</h2><span class="code-tag">v06</span></div>
        <div id="tablacupos" class="card-app-body"></div>
      </div>
      <div class="card-app">
        <div class="card-app-header"><h2>Becas otorgadas por convocatoria</h2><span class="code-tag">v02</span></div>
        <div id="tablaotorgadas" class="card-app-body"></div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card-app">
        <div class="card-app-header"><h2>Postulaciones por estudiante y año</h2><span class="code-tag">v01</span></div>
        <div id="tablaporestudiante" class="card-app-body"></div>
      </div>
      <div class="card-app">
        <div class="card-app-header"><h2>Promedio de seguimiento por beca</h2><span class="code-tag">v05</span></div>
        <div id="tablapromedios" class="card-app-body"></div>
      </div>
    </div>

    <div class="card-app">
      <div class="card-app-header">
        <h2>Becas más postuladas</h2><span class="code-tag">p07</span>
        <form id="formranking" class="d-flex gap-2 ms-auto">
          <input id="anio" type="number" min="2000" max="2100" class="form-control form-control-sm" aria-label="Año" style="width: 110px" required>
          <button class="btn btn-soft btn-sm" type="submit">Consultar</button>
        </form>
      </div>
      <div id="graficoranking" class="card-app-body"></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/charts.js"></script>
  <script src="../js/reportesbecas.js"></script>
</body>
</html>
