<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Postulaciones | UDH Becas y Bienestar</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
  <link href="../css/flujo.css" rel="stylesheet">
  <script src="../js/theme.js"></script>
</head>
<body data-page="postulaciones" data-title="Postulaciones" data-section="Becas"
      data-description="Registra, evalúa, revisa documentos y otorga becas. Cada acción usa un procedimiento de la base de datos.">
  <main>
    <div class="page-actions">
      <button id="btn-nuevo" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nueva postulación</button>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input id="buscador" type="search" class="form-control" placeholder="Buscar estudiante, DNI o beca" aria-label="Buscar">
      </div>
      <select id="filtro-estado" class="form-select" aria-label="Filtrar por estado" style="max-width: 190px">
        <option value="">Todos los estados</option><option value="REGISTRADA">Registrada</option><option value="EN_EVALUACION">En evaluación</option><option value="APROBADA">Aprobada</option><option value="RECHAZADA">Rechazada</option>
      </select>
      <select id="filtro-convocatoria" class="form-select" aria-label="Filtrar por convocatoria" style="max-width: 260px"></select>
      <span id="contador" class="count-pill"></span>
    </div>

    <div class="tbl-wrap">
      <table id="tabla" class="table table-hover table-app">
        <thead><tr><th>Estudiante</th><th>Convocatoria</th><th>Datos</th><th>Estado</th><th>Evaluación</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form id="formulario" class="modal-content" novalidate>
        <div class="modal-header">
          <span class="modal-icon"><i class="bi bi-file-earmark-plus"></i></span>
          <h2 id="modal-titulo" class="modal-title"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="modal-alertas"></div>
          <div class="mb-3">
            <label for="codest" class="form-label">Estudiante</label>
            <select id="codest" name="codest" data-type="number" class="form-select" required></select>
            <div class="invalid-feedback">Selecciona un estudiante.</div>
          </div>
          <div class="mb-3">
            <label for="codconv" class="form-label">Convocatoria abierta</label>
            <select id="codconv" name="codconv" data-type="number" class="form-select" required></select>
            <div class="invalid-feedback">Selecciona una convocatoria.</div>
          </div>
          <div class="row g-3">
          <div class="col-6">
            <label for="prompost" class="form-label">Promedio</label>
            <input id="prompost" name="prompost" data-type="number" type="number" min="0" max="20" step="0.01" class="form-control" required>
            <div class="invalid-feedback">Entre 0 y 20.</div>
          </div>
          <div class="col-6">
            <label for="ingfampost" class="form-label">Ingreso familiar (S/)</label>
            <input id="ingfampost" name="ingfampost" data-type="number" type="number" min="0" step="0.01" class="form-control" required>
            <div class="invalid-feedback">Mínimo 0.</div>
          </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Registrar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="modalevaluar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form id="formevaluar" class="modal-content" novalidate>
        <div class="modal-header">
          <span class="modal-icon"><i class="bi bi-clipboard-check"></i></span>
          <h2 class="modal-title">Evaluar postulación</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="alertasevaluar"></div>
          <p id="resumenevaluar" class="text-muted"></p>
          <div class="mb-3">
            <label for="puntpost" class="form-label">Puntaje (0 a 100)</label>
            <input id="puntpost" name="puntpost" data-type="number" type="number" min="0" max="100" step="0.01" class="form-control" required>
            <div class="invalid-feedback">Ingresa el puntaje.</div>
          </div>
          <div class="mb-3">
            <label for="estpost" class="form-label">Resultado</label>
            <select id="estpost" name="estpost" class="form-select" required><option value="EN_EVALUACION">En evaluación</option><option value="APROBADA">Aprobada</option><option value="RECHAZADA">Rechazada</option></select>
            <div class="invalid-feedback">Elige un resultado.</div>
          </div>
          <div class="mb-3">
            <label for="codpereval" class="form-label">Evaluador</label>
            <select id="codpereval" name="codpereval" data-type="number" class="form-select" required></select>
            <div class="invalid-feedback">Selecciona al evaluador.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar evaluación</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="modalotorgar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form id="formotorgar" class="modal-content" novalidate>
        <div class="modal-header">
          <span class="modal-icon"><i class="bi bi-award"></i></span>
          <h2 class="modal-title">Otorgar beca</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="alertasotorgar"></div>
          <p id="resumenotorgar" class="text-muted"></p>
          <div class="row g-3">
          <div class="col-6">
            <label for="fechiniotor" class="form-label">Inicio de la beca</label>
            <input id="fechiniotor" name="fechiniotor" type="date" class="form-control" required>
            <div class="invalid-feedback">Obligatorio.</div>
          </div>
          <div class="col-6">
            <label for="fechfinotor" class="form-label">Fin de la beca</label>
            <input id="fechfinotor" name="fechfinotor" type="date" class="form-control" required>
            <div class="invalid-feedback">Obligatorio.</div>
          </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Otorgar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="modaldocs" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-icon"><i class="bi bi-folder2-open"></i></span>
          <h2 class="modal-title">Documentos presentados</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="alertasdocs"></div>
          <p id="resumendocs" class="text-muted"></p>
          <div id="listadocs"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/crud.js"></script>
  <script src="../js/sesion.js"></script>
  <script src="../js/postulaciones.js"></script>
</body>
</html>
