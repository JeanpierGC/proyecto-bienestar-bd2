<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis citas | UDH Becas y Bienestar</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
  <link href="../css/flujo.css" rel="stylesheet">
  <script src="../js/theme.js"></script>
</head>
<body data-page="miscitas" data-title="Mis citas" data-section="Estudiante"
      data-description="Solicita una cita con el profesional que necesites y revisa su estado.">
  <main>
    <div class="page-actions">
      <button id="nuevacita" class="btn btn-primary" disabled><i class="bi bi-plus-lg"></i> Solicitar cita</button>
    </div>
    <div class="toolbar">
      <select id="estudiante" class="form-select" aria-label="Estudiante" style="min-width: 260px"></select>
      <span id="contador" class="count-pill"></span>
    </div>
    <div id="lista" class="d-grid gap-3"></div>
  </main>

  <div class="modal fade" id="modalcita" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form id="formcita" class="modal-content" novalidate>
        <div class="modal-header">
          <span class="modal-icon"><i class="bi bi-calendar-plus"></i></span>
          <h2 class="modal-title">Solicitar cita</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="alertascita"></div>
          <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="servicio" class="form-label">Servicio</label>
            <select id="servicio" class="form-select" required></select>
            <div class="invalid-feedback">Selecciona un servicio.</div>
          </div>
          <div class="col-md-6">
            <label for="codper" class="form-label">Profesional</label>
            <select id="codper" name="codper" data-type="number" class="form-select" required></select>
            <div class="invalid-feedback">Selecciona al profesional.</div>
          </div>
          <div class="col-md-4">
            <label for="fechcita" class="form-label">Fecha</label>
            <input id="fechcita" name="fechcita" type="date" class="form-control" required>
            <div class="invalid-feedback">Obligatoria.</div>
          </div>
          <div class="col-md-4">
            <label for="horacita" class="form-label">Hora</label>
            <input id="horacita" name="horacita" type="time" class="form-control" required>
            <div class="invalid-feedback">Obligatoria.</div>
          </div>
          <div class="col-md-4">
            <label for="modcita" class="form-label">Modalidad</label>
            <select id="modcita" name="modcita" class="form-select" required><option value="PRESENCIAL">Presencial</option><option value="VIRTUAL">Virtual</option></select>
            <div class="invalid-feedback">Elige una.</div>
          </div>
          </div>
          <div class=" ">
            <label for="motcita" class="form-label">Motivo</label>
            <input id="motcita" name="motcita" class="form-control" maxlength="200">
            <div class="invalid-feedback"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Solicitar</button>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/sesion.js"></script>
  <script src="../js/miscitas.js"></script>
</body>
</html>
