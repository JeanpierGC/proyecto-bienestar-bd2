<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convocatorias | UDH Becas y Bienestar</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
  <script src="../js/theme.js"></script>
</head>
<body data-page="convocatorias" data-title="Convocatorias" data-section="Becas"
      data-description="Periodos de postulación de cada beca, con sus fechas y cupos.">
  <main>
    <div class="page-actions">
      <button id="btn-nuevo" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nueva convocatoria</button>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input id="buscador" type="search" class="form-control" placeholder="Buscar convocatoria o beca" aria-label="Buscar">
      </div>
      <select id="filtro-beca" class="form-select" aria-label="Filtrar por beca"></select>
      <span id="contador" class="count-pill"></span>
    </div>

    <div class="tbl-wrap">
      <table id="tabla" class="table table-hover table-app">
        <thead><tr><th>Convocatoria</th><th>Beca</th><th>Fechas</th><th>Cupos</th><th>Estado</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <form id="formulario" class="modal-content" novalidate>
        <div class="modal-header">
          <span class="modal-icon"><i class="bi bi-megaphone"></i></span>
          <h2 id="modal-titulo" class="modal-title"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="modal-alertas"></div>
          <div class="mb-3">
            <label for="nomconv" class="form-label">Nombre de la convocatoria</label>
            <input id="nomconv" name="nomconv" class="form-control" maxlength="100" placeholder="Ej. Beca Excelencia 2026-II" required>
            <div class="invalid-feedback">El nombre es obligatorio.</div>
          </div>
          <div class="row g-3 mb-3">
          <div class="col-md-8">
            <label for="codbeca" class="form-label">Beca</label>
            <select id="codbeca" name="codbeca" data-type="number" class="form-select" required></select>
            <div class="invalid-feedback">Selecciona una beca.</div>
          </div>
          <div class="col-md-4">
            <label for="perioconv" class="form-label">Periodo</label>
            <input id="perioconv" name="perioconv" class="form-control" maxlength="10" placeholder="2026-II" required>
            <div class="invalid-feedback">Obligatorio.</div>
          </div>
          <div class="col-md-4">
            <label for="fechinconv" class="form-label">Inicio</label>
            <input id="fechinconv" name="fechinconv" type="date" class="form-control" required>
            <div class="invalid-feedback">Obligatorio.</div>
          </div>
          <div class="col-md-4">
            <label for="fechfinconv" class="form-label">Fin</label>
            <input id="fechfinconv" name="fechfinconv" type="date" class="form-control" required>
            <div class="invalid-feedback">Obligatorio.</div>
          </div>
          <div class="col-md-4">
            <label for="cupconv" class="form-label">Cupos</label>
            <input id="cupconv" name="cupconv" data-type="number" type="number" min="1" class="form-control" required>
            <div class="invalid-feedback">Mínimo 1.</div>
          </div>
          <div class="col-md-6">
            <label for="estconv" class="form-label">Estado</label>
            <select id="estconv" name="estconv" class="form-select" required><option value="ABIERTA">Abierta</option><option value="EN_EVALUACION">En evaluación</option><option value="CERRADA">Cerrada</option></select>
            <div class="invalid-feedback">Elige un estado.</div>
          </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/crud.js"></script>
  <script src="../js/convocatorias.js"></script>
</body>
</html>
