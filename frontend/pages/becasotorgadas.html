<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Becas otorgadas | UDH Becas y Bienestar</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
  <link href="../css/flujo.css" rel="stylesheet">
  <script src="../js/theme.js"></script>
</head>
<body data-page="becasotorgadas" data-title="Becas otorgadas" data-section="Becas"
      data-description="Becas vigentes, su seguimiento académico y su estado.">
  <main>
    <div class="page-actions">
      <button id="btn-nuevo" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Otorgar beca</button>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input id="buscador" type="search" class="form-control" placeholder="Buscar estudiante o beca" aria-label="Buscar">
      </div>
      <span id="contador" class="count-pill"></span>
    </div>

    <div class="tbl-wrap">
      <table id="tabla" class="table table-hover table-app">
        <thead><tr><th>Estudiante</th><th>Beca</th><th>Vigencia</th><th>Estado</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form id="formulario" class="modal-content" novalidate>
        <div class="modal-header">
          <span class="modal-icon"><i class="bi bi-award"></i></span>
          <h2 id="modal-titulo" class="modal-title"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="modal-alertas"></div>
          <div class="mb-3">
            <label for="codpost" class="form-label">Postulación aprobada</label>
            <select id="codpost" name="codpost" data-type="number" class="form-select" required></select>
            <div class="invalid-feedback">Selecciona una postulación.</div>
          </div>
          <div class="row g-3">
          <div class="col-6">
            <label for="fechiniotor" class="form-label">Inicio</label>
            <input id="fechiniotor" name="fechiniotor" type="date" class="form-control" required>
            <div class="invalid-feedback">Obligatorio.</div>
          </div>
          <div class="col-6">
            <label for="fechfinotor" class="form-label">Fin</label>
            <input id="fechfinotor" name="fechfinotor" type="date" class="form-control" required>
            <div class="invalid-feedback">Obligatorio.</div>
          </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Otorgar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="modalseg" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-icon"><i class="bi bi-activity"></i></span>
          <h2 class="modal-title">Seguimiento de la beca</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="alertasseg"></div>
          <p id="resumenseg" class="text-muted"></p>
          <div class="d-flex gap-2 align-items-center mb-4">
            <label for="estadootor" class="form-label mb-0">Estado de la beca</label>
            <select id="estadootor" class="form-select w-auto"><option value="VIGENTE">Vigente</option><option value="SUSPENDIDA">Suspendida</option><option value="REVOCADA">Revocada</option><option value="FINALIZADA">Finalizada</option></select>
            <button id="guardarestado" type="button" class="btn btn-soft btn-sm">Guardar estado</button>
          </div>
          <h3 class="form-section-title">Seguimientos registrados</h3>
          <div id="listaseg" class="mb-4"></div>
          <h3 class="form-section-title">Registrar seguimiento</h3>
          <form id="formseg" class="row g-2" novalidate>
            <div class="col-md-3"><input name="fechsegb" type="date" class="form-control" aria-label="Fecha" required></div>
            <div class="col-md-3"><input name="promsegb" data-type="number" type="number" min="0" max="20" step="0.01" class="form-control" placeholder="Promedio" aria-label="Promedio" required></div>
            <div class="col-md-3"><select name="cumsegb" class="form-select" aria-label="Cumple condiciones" required><option value="1">Cumple</option><option value="0">No cumple</option></select></div>
            <div class="col-md-3"><select name="codperresp" id="codperresp" data-type="number" class="form-select" aria-label="Responsable" required></select></div>
            <div class="col-md-9"><input name="obssegb" class="form-control" placeholder="Observaciones" aria-label="Observaciones"></div>
            <div class="col-md-3"><button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i> Agregar</button></div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/crud.js"></script>
  <script src="../js/sesion.js"></script>
  <script src="../js/becasotorgadas.js"></script>
</body>
</html>
