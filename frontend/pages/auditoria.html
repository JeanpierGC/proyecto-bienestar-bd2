<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auditoría | UDH Becas y Bienestar</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
  <link href="../css/flujo.css" rel="stylesheet">
  <script src="../js/theme.js"></script>
</head>
<body data-page="auditoria" data-title="Auditoría" data-section="Administración"
      data-description="Historial de cambios que registran los triggers de la base de datos en las tablas de control.">
  <main>
    <ul id="pestanas" class="nav nav-pills mb-3">
      <li class="nav-item"><button class="nav-link active" data-tabla="postulaciones">Postulaciones <span class="code-tag">ctrl_postu</span></button></li>
      <li class="nav-item"><button class="nav-link" data-tabla="otorgamientos">Becas otorgadas <span class="code-tag">ctrl_otor</span></button></li>
      <li class="nav-item"><button class="nav-link" data-tabla="citas">Citas <span class="code-tag">ctrl_cita</span></button></li>
    </ul>
    <p class="text-muted">Solo lectura: estos registros los escriben los triggers de la base de datos cada vez que se inserta, modifica o elimina un dato.</p>
    <div class="toolbar">
      <select id="filtro-accion" class="form-select" aria-label="Filtrar por acción" style="max-width: 220px">
        <option value="">Todas las acciones</option><option value="INSERCION">Inserción</option><option value="ACTUALIZACION">Actualización</option><option value="ELIMINACION">Eliminación</option>
      </select>
      <span id="contador" class="count-pill"></span>
    </div>
    <div id="registros"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/sesion.js"></script>
  <script src="../js/charts.js"></script>
  <script src="../js/auditoria.js"></script>
</body>
</html>
