<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reglas | UDH Becas y Bienestar</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
  <script src="../js/theme.js"></script>
</head>
<body data-page="reglas" data-title="Reglas" data-section="Becas"
      data-description="Condiciones medibles de cada beca, por ejemplo promedio mínimo.">
  <main>
    <div class="page-actions">
      <button id="btn-nuevo" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nueva regla</button>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input id="buscador" type="search" class="form-control" placeholder="Buscar regla o beca" aria-label="Buscar">
      </div>
      <select id="filtro-beca" class="form-select" aria-label="Filtrar por beca"></select>
      <span id="contador" class="count-pill"></span>
    </div>

    <div class="tbl-wrap">
      <table id="tabla" class="table table-hover table-app">
        <thead><tr><th>Regla</th><th>Condición</th><th>Beca</th><th>Código</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form id="formulario" class="modal-content" novalidate>
        <div class="modal-header">
          <span class="modal-icon"><i class="bi bi-rulers"></i></span>
          <h2 id="modal-titulo" class="modal-title"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="modal-alertas"></div>
          <div class="mb-3">
            <label for="nomreg" class="form-label">Nombre de la regla</label>
            <input id="nomreg" name="nomreg" class="form-control" maxlength="100" placeholder="Ej. Promedio mínimo" required>
            <div class="invalid-feedback">El nombre es obligatorio.</div>
          </div>
          <div class="row g-3 mb-3">
          <div class="col-5">
            <label for="opreg" class="form-label">Operador</label>
            <select id="opreg" name="opreg" class="form-select" required><option value="">Elige</option><option>&gt;=</option><option>&lt;=</option><option>&gt;</option><option>&lt;</option><option>=</option></select>
            <div class="invalid-feedback">Elige un operador.</div>
          </div>
          <div class="col-7">
            <label for="valreg" class="form-label">Valor</label>
            <input id="valreg" name="valreg" data-type="number" type="number" step="0.01" class="form-control" required>
            <div class="invalid-feedback">Ingresa un valor.</div>
          </div>
          </div>
          <div class="mb-3">
            <label for="codbeca" class="form-label">Beca</label>
            <select id="codbeca" name="codbeca" data-type="number" class="form-select" required></select>
            <div class="invalid-feedback">Selecciona una beca.</div>
          </div>
          <div class=" ">
            <label for="descreg" class="form-label">Descripción</label>
            <textarea id="descreg" name="descreg" class="form-control" rows="2" maxlength="255"></textarea>
            <div class="invalid-feedback"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/crud.js"></script>
  <script src="../js/reglas.js"></script>
</body>
</html>
