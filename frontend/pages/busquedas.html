<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscar estudiantes | UDH Becas y Bienestar</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
  <link href="../css/flujo.css" rel="stylesheet">
  <script src="../js/theme.js"></script>
</head>
<body data-page="busquedas" data-title="Buscar estudiantes" data-section="Administración"
      data-description="Busca estudiantes por apellido con el procedimiento p06 y muestra su edad con la función f3.">
  <main>
    <div class="toolbar">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input id="apellido" type="search" class="form-control" placeholder="Escribe el inicio del apellido" aria-label="Apellido" autofocus>
      </div>
      <span id="contador" class="count-pill"></span>
    </div>
    <p class="text-muted">La búsqueda la hace el procedimiento <span class="code-tag">p06</span> y la edad la calcula la función <span class="code-tag">f3</span>.</p>
    <div id="resultados"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/sesion.js"></script>
  <script src="../js/charts.js"></script>
  <script src="../js/busquedas.js"></script>
</body>
</html>
