<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atenciones | UDH Becas y Bienestar</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
  <link href="../css/flujo.css" rel="stylesheet">
  <script src="../js/theme.js"></script>
</head>
<body data-page="atenciones" data-title="Atenciones" data-section="Bienestar"
      data-description="Atenciones realizadas. El nivel de vigilancia de cada estudiante lo calcula la función f5 de la base de datos.">
  <main>
    <div class="page-actions">
      <button id="btn-nuevo" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nueva atención</button>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input id="buscador" type="search" class="form-control" placeholder="Buscar estudiante, DNI o nivel" aria-label="Buscar">
      </div>
      <span id="contador" class="count-pill"></span>
    </div>

    <div class="tbl-wrap">
      <table id="tabla" class="table table-hover table-app">
        <thead><tr><th>Fecha</th><th>Estudiante</th><th>Atendió</th><th>Nivel</th><th>Seguimiento</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form id="formulario" class="modal-content" novalidate>
        <div class="modal-header">
          <span class="modal-icon"><i class="bi bi-clipboard2-pulse"></i></span>
          <h2 id="modal-titulo" class="modal-title"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="modal-alertas"></div>
          <div class="mb-3">
            <label for="codcita" class="form-label">Cita programada</label>
            <select id="codcita" name="codcita" data-type="number" class="form-select" required></select>
            <div class="invalid-feedback">Selecciona una cita.</div>
          </div>
          <div class="mb-3">
            <label for="resumaten" class="form-label">Resumen de la atención</label>
            <textarea id="resumaten" name="resumaten" class="form-control" rows="3" required></textarea>
            <div class="invalid-feedback">El resumen es obligatorio.</div>
          </div>
          <div class="mb-3">
            <label for="recomaten" class="form-label">Recomendaciones</label>
            <textarea id="recomaten" name="recomaten" class="form-control" rows="2"></textarea>
            <div class="invalid-feedback"></div>
          </div>
          <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="nivelaten" class="form-label">Nivel de riesgo</label>
            <select id="nivelaten" name="nivelaten" class="form-select" required><option value="BAJO">Bajo</option><option value="MEDIO">Medio</option><option value="ALTO">Alto</option><option value="CRITICO">Crítico</option></select>
            <div class="invalid-feedback">Elige un nivel.</div>
          </div>
          <div class="col-md-6">
            <label for="reqseg" class="form-label">¿Requiere seguimiento?</label>
            <select id="reqseg" name="reqseg" class="form-select" required><option value="0">No</option><option value="1">Sí</option></select>
            <div class="invalid-feedback">Elige una opción.</div>
          </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="modalseg" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-icon"><i class="bi bi-activity"></i></span>
          <h2 class="modal-title">Seguimiento del caso</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="alertasseg"></div>
          <p id="resumenseg" class="text-muted"></p>
          <div id="listaseg" class="mb-4"></div>
          <h3 id="tituloformseg" class="form-section-title">Registrar seguimiento</h3>
          <form id="formseg" class="row g-2" novalidate>
            <div class="col-md-4"><label class="form-label small mb-1" for="fechseg">Fecha</label><input id="fechseg" name="fechseg" type="date" class="form-control" required></div>
            <div class="col-md-4"><label class="form-label small mb-1" for="estseg">Estado</label><select id="estseg" name="estseg" class="form-select"><option value="ABIERTO">Abierto</option><option value="EN_PROCESO">En proceso</option><option value="CERRADO">Cerrado</option></select></div>
            <div class="col-md-4"><label class="form-label small mb-1" for="fechprox">Próxima sesión</label><input id="fechprox" name="fechprox" type="date" class="form-control"></div>
            <div class="col-12"><label class="form-label small mb-1" for="descseg">Descripción</label><textarea id="descseg" name="descseg" class="form-control" rows="2" required></textarea></div>
            <div class="col-12 d-flex gap-2 justify-content-end">
              <button id="cancelaredicion" type="button" class="btn btn-ghost">Limpiar</button>
              <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar seguimiento</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/crud.js"></script>
  <script src="../js/sesion.js"></script>
  <script src="../js/linea.js"></script>
  <script src="../js/atenciones.js"></script>
</body>
</html>
