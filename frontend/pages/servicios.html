<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Servicios | UDH Becas y Bienestar</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
  <link href="../css/flujo.css" rel="stylesheet">
  <script src="../js/theme.js"></script>
</head>
<body data-page="servicios" data-title="Servicios" data-section="Bienestar"
      data-description="Servicios de bienestar universitario: psicología, orientación y servicio social.">
  <main>
    <div class="page-actions">
      <button id="btn-nuevo" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nuevo servicio</button>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input id="buscador" type="search" class="form-control" placeholder="Buscar servicio" aria-label="Buscar">
      </div>
      <span id="contador" class="count-pill"></span>
    </div>

    <div class="tbl-wrap">
      <table id="tabla" class="table table-hover table-app">
        <thead><tr><th>Servicio</th><th>Descripción</th><th>Código</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form id="formulario" class="modal-content" novalidate>
        <div class="modal-header">
          <span class="modal-icon"><i class="bi bi-heart-pulse"></i></span>
          <h2 id="modal-titulo" class="modal-title"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="modal-alertas"></div>
          <div class="mb-3">
            <label for="nomserv" class="form-label">Nombre del servicio</label>
            <input id="nomserv" name="nomserv" class="form-control" maxlength="100" placeholder="Ej. Psicología" required>
            <div class="invalid-feedback">El nombre es obligatorio.</div>
          </div>
          <div class="mb-3">
            <label for="descserv" class="form-label">Descripción</label>
            <textarea id="descserv" name="descserv" class="form-control" rows="3" maxlength="255"></textarea>
            <div class="invalid-feedback"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/crud.js"></script>
  <script src="../js/sesion.js"></script>
  <script src="../js/servicios.js"></script>
</body>
</html>
