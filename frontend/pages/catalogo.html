<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Becas disponibles | UDH Becas y Bienestar</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
  <script src="../js/theme.js"></script>
</head>
<body data-page="catalogo" data-title="Becas disponibles" data-section="Estudiante"
      data-description="Conoce las becas, sus requisitos y reglas, y postula cuando la convocatoria esté abierta.">
  <main>
    <div class="toolbar">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input id="buscador" type="search" class="form-control" placeholder="Buscar beca o tipo" aria-label="Buscar beca">
      </div>
      <select id="filtro-estado" class="form-select" style="min-width: 250px" aria-label="Filtrar por estado de la convocatoria">
        <option value="">Todas las convocatorias</option>
        <option value="ABIERTA">Abiertas</option>
        <option value="EN_EVALUACION">En evaluación</option>
        <option value="CERRADA">Cerradas</option>
      </select>
      <span id="contador" class="count-pill"></span>
    </div>
    <div id="tarjetas" class="row g-3"></div>
  </main>

  <div class="modal fade" id="modaldetalle" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <span class="modal-icon"><i class="bi bi-award"></i></span>
          <h2 id="detalletitulo" class="modal-title"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p id="detalledescripcion" class="text-muted"></p>
          <h3 class="form-section-title">Requisitos</h3>
          <div id="detallerequisitos" class="mb-4"></div>
          <h3 class="form-section-title">Reglas</h3>
          <div id="detallereglas"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cerrar</button>
          <a id="botonpostular" class="btn btn-primary" href="#">Postular</a>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/catalogo.js"></script>
</body>
</html>
