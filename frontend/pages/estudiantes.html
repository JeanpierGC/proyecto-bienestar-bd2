<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudiantes | UDH Becas y Bienestar</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
  <script src="../js/theme.js"></script>
</head>
<body data-page="estudiantes" data-title="Estudiantes" data-section="Académico"
      data-description="Datos personales y académicos de los estudiantes. Busca por nombre, DNI o correo.">
  <main>
    <div class="page-actions">
      <button id="btn-nuevo" class="btn btn-primary"><i class="bi bi-person-plus"></i> Nuevo estudiante</button>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input id="buscador" type="search" class="form-control" placeholder="Buscar por nombre, DNI o correo" aria-label="Buscar estudiante">
      </div>
      <select id="filtro-escuela" class="form-select" aria-label="Filtrar por escuela"></select>
      <span id="contador" class="count-pill"></span>
    </div>

    <div class="tbl-wrap">
      <table id="tabla" class="table table-hover table-app">
        <thead>
          <tr><th>Estudiante</th><th>DNI</th><th>Ciclo</th><th>Escuela</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <form id="formulario" class="modal-content" novalidate>
        <div class="modal-header">
          <span class="modal-icon"><i class="bi bi-person-vcard"></i></span>
          <h2 id="modal-titulo" class="modal-title"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="modal-alertas"></div>
          <h3 class="form-section-title">Datos personales</h3>
          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="nomest" class="form-label">Nombres</label>
              <input id="nomest" name="nomest" class="form-control" maxlength="50" required>
              <div class="invalid-feedback">Los nombres son obligatorios.</div>
            </div>
            <div class="col-md-6">
              <label for="apeest" class="form-label">Apellidos</label>
              <input id="apeest" name="apeest" class="form-control" maxlength="50" required>
              <div class="invalid-feedback">Los apellidos son obligatorios.</div>
            </div>
            <div class="col-md-4">
              <label for="dniest" class="form-label">DNI</label>
              <input id="dniest" name="dniest" class="form-control" pattern="\d{8}" maxlength="8"
                     inputmode="numeric" placeholder="8 dígitos" required>
              <div class="invalid-feedback">El DNI debe tener 8 dígitos.</div>
            </div>
            <div class="col-md-4">
              <label for="fnacest" class="form-label">Fecha de nacimiento</label>
              <input id="fnacest" name="fnacest" type="date" class="form-control" required>
              <div class="invalid-feedback">La fecha es obligatoria.</div>
            </div>
            <div class="col-md-4">
              <label for="correst" class="form-label">Correo institucional</label>
              <input id="correst" name="correst" type="email" class="form-control" maxlength="100"
                     placeholder="usuario@udh.edu.pe" required>
              <div class="invalid-feedback">Ingresa un correo válido.</div>
            </div>
            <div class="col-12">
              <label for="direst" class="form-label">Dirección (opcional)</label>
              <input id="direst" name="direst" class="form-control" maxlength="150">
            </div>
          </div>
          <h3 class="form-section-title">Datos académicos</h3>
          <div class="row g-3">
            <div class="col-md-8">
              <label for="codesc" class="form-label">Escuela profesional</label>
              <select id="codesc" name="codesc" data-type="number" class="form-select" required></select>
              <div class="invalid-feedback">Selecciona una escuela.</div>
            </div>
            <div class="col-md-4">
              <label for="cicest" class="form-label">Ciclo</label>
              <input id="cicest" name="cicest" type="number" data-type="number" class="form-control"
                     min="1" max="14" placeholder="1 a 14" required>
              <div class="invalid-feedback">El ciclo debe estar entre 1 y 14.</div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/crud.js"></script>
  <script src="../js/estudiantes.js"></script>
</body>
</html>
