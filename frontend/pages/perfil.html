<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil | UDH Becas y Bienestar</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
  <link href="../css/flujo.css" rel="stylesheet">
  <script src="../js/theme.js"></script>
</head>
<body data-page="perfil" data-title="Mi perfil" data-section="Cuenta"
      data-description="Tus datos registrados en la universidad y el cambio de contraseña.">
  <main>
    <div class="grid-2">
      <div class="card-app">
        <div class="card-app-header">
          <div>
            <h2>Mis datos</h2>
            <p>Si algún dato está mal, pide que lo corrijan en Bienestar Universitario</p>
          </div>
        </div>
        <div class="card-app-body py-2" id="datos"></div>
      </div>
      <div class="card-app">
        <div class="card-app-header">
          <div>
            <h2>Cambiar contraseña</h2>
            <p>Mínimo 6 caracteres</p>
          </div>
        </div>
        <div class="card-app-body">
          <form id="formclave" novalidate>
            <div id="alertasclave"></div>
            <div class="mb-3">
              <label for="actual" class="form-label">Contraseña actual</label>
              <input id="actual" name="actual" type="password" class="form-control" autocomplete="current-password" required>
              <div class="invalid-feedback">Escribe tu contraseña actual.</div>
            </div>
            <div class="mb-3">
              <label for="nueva" class="form-label">Nueva contraseña</label>
              <input id="nueva" name="nueva" type="password" class="form-control" minlength="6" maxlength="100" autocomplete="new-password" required>
              <div class="invalid-feedback">Debe tener al menos 6 caracteres.</div>
            </div>
            <div class="mb-3">
              <label for="confirmar" class="form-label">Repite la nueva contraseña</label>
              <input id="confirmar" type="password" class="form-control" minlength="6" maxlength="100" autocomplete="new-password" required>
              <div class="invalid-feedback">Repite la nueva contraseña.</div>
            </div>
            <button type="submit" class="btn btn-primary"><i class="bi bi-key"></i> Guardar contraseña</button>
          </form>
        </div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/sesion.js"></script>
  <script src="../js/perfil.js"></script>
</body>
</html>
