<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Postular a una beca | UDH Becas y Bienestar</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
  <link href="../css/flujo.css" rel="stylesheet">
  <script src="../js/theme.js"></script>
</head>
<body data-page="catalogo" data-title="Postular a una beca" data-section="Estudiante"
      data-description="Completa tus datos. El registro valida convocatoria abierta, postulación única y promedio mínimo.">
  <main>
    <div class="grid-2">
      <div class="card-app">
        <div class="card-app-header"><h2>Datos de la postulación</h2></div>
        <form id="formpostulacion" class="card-app-body" novalidate>
          <div id="alertas"></div>
          <div class="mb-3">
            <label for="estudiante" class="form-label">Postulante</label>
            <select id="estudiante" name="codest" data-type="number" class="form-select" required></select>
            <div class="invalid-feedback">Selecciona tu perfil.</div>
          </div>
          <div class="mb-3">
            <label for="convocatoria" class="form-label">Convocatoria</label>
            <select id="convocatoria" name="codconv" data-type="number" class="form-select" required></select>
            <div class="invalid-feedback">Selecciona una convocatoria.</div>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="prompost" class="form-label">Promedio ponderado</label>
              <input id="prompost" name="prompost" data-type="number" type="number" min="0" max="20" step="0.01" class="form-control" required>
              <div class="invalid-feedback">Ingresa un promedio entre 0 y 20.</div>
            </div>
            <div class="col-md-6">
              <label for="ingfampost" class="form-label">Ingreso familiar mensual (S/)</label>
              <input id="ingfampost" name="ingfampost" data-type="number" type="number" min="0" step="0.01" class="form-control" required>
              <div class="invalid-feedback">Ingresa un monto mayor o igual a 0.</div>
            </div>
          </div>
          <button id="enviar" type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Enviar postulación</button>
        </form>
      </div>
      <div class="card-app">
        <div class="card-app-header"><h2>Sobre la beca</h2></div>
        <div id="infobeca" class="card-app-body"></div>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/sesion.js"></script>
  <script src="../js/postular.js"></script>
</body>
</html>
