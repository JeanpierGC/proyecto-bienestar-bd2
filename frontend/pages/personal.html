<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal | UDH Becas y Bienestar</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
  <link href="../css/flujo.css" rel="stylesheet">
  <script src="../js/theme.js"></script>
</head>
<body data-page="personal" data-title="Personal" data-section="Bienestar"
      data-description="Profesionales que atienden los servicios de bienestar.">
  <main>
    <div class="page-actions">
      <button id="btn-nuevo" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nuevo personal</button>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input id="buscador" type="search" class="form-control" placeholder="Buscar por nombre, DNI, cargo o servicio" aria-label="Buscar">
      </div>
      <span id="contador" class="count-pill"></span>
    </div>

    <div class="tbl-wrap">
      <table id="tabla" class="table table-hover table-app">
        <thead><tr><th>Personal</th><th>Cargo</th><th>Servicio</th><th>DNI</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <form id="formulario" class="modal-content" novalidate>
        <div class="modal-header">
          <span class="modal-icon"><i class="bi bi-person-badge"></i></span>
          <h2 id="modal-titulo" class="modal-title"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="modal-alertas"></div>
          <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="nomper" class="form-label">Nombres</label>
            <input id="nomper" name="nomper" class="form-control" maxlength="50" required>
            <div class="invalid-feedback">Obligatorio.</div>
          </div>
          <div class="col-md-6">
            <label for="apeper" class="form-label">Apellidos</label>
            <input id="apeper" name="apeper" class="form-control" maxlength="50" required>
            <div class="invalid-feedback">Obligatorio.</div>
          </div>
          <div class="col-md-4">
            <label for="dniper" class="form-label">DNI</label>
            <input id="dniper" name="dniper" class="form-control" maxlength="8" inputmode="numeric" pattern="\d{8}" required>
            <div class="invalid-feedback">Debe tener 8 dígitos.</div>
          </div>
          <div class="col-md-8">
            <label for="corrper" class="form-label">Correo</label>
            <input id="corrper" name="corrper" type="email" class="form-control" maxlength="100" required>
            <div class="invalid-feedback">Ingresa un correo válido.</div>
          </div>
          <div class="col-md-6">
            <label for="cargoper" class="form-label">Cargo</label>
            <input id="cargoper" name="cargoper" class="form-control" maxlength="50" placeholder="Ej. Psicóloga" required>
            <div class="invalid-feedback">Obligatorio.</div>
          </div>
          <div class="col-md-6">
            <label for="codserv" class="form-label">Servicio</label>
            <select id="codserv" name="codserv" data-type="number" class="form-select" required></select>
            <div class="invalid-feedback">Selecciona un servicio.</div>
          </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/crud.js"></script>
  <script src="../js/sesion.js"></script>
  <script src="../js/personal.js"></script>
</body>
</html>
