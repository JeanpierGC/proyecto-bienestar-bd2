<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fichas psicológicas | UDH Becas y Bienestar</title>
  <link rel="icon" type="image/png" href="../img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/styles.css" rel="stylesheet">
  <link href="../css/flujo.css" rel="stylesheet">
  <script src="../js/theme.js"></script>
</head>
<body data-page="fichas" data-title="Fichas psicológicas" data-section="Bienestar"
      data-description="Historia psicológica del estudiante. El diagnóstico y el plan se completan después; para cerrar la ficha hacen falta ambos.">
  <main>
    <div class="page-actions">
      <button id="btn-nuevo" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Nueva ficha</button>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <i class="bi bi-search"></i>
        <input id="buscador" type="search" class="form-control" placeholder="Buscar estudiante, DNI o motivo" aria-label="Buscar">
      </div>
      <span id="contador" class="count-pill"></span>
    </div>

    <div class="tbl-wrap">
      <table id="tabla" class="table table-hover table-app">
        <thead><tr><th>Estudiante</th><th>Motivo</th><th>Responsable</th><th>Apertura</th><th>Estado</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <div class="modal fade" id="modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <form id="formulario" class="modal-content" novalidate>
        <div class="modal-header">
          <span class="modal-icon"><i class="bi bi-journal-medical"></i></span>
          <h2 id="modal-titulo" class="modal-title"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="modal-alertas"></div>
          <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="codest" class="form-label">Estudiante</label>
            <select id="codest" name="codest" data-type="number" class="form-select" required></select>
            <div class="invalid-feedback">Selecciona un estudiante.</div>
          </div>
          <div class="col-md-6">
            <label for="codperresp" class="form-label">Responsable</label>
            <select id="codperresp" name="codperresp" data-type="number" class="form-select" required></select>
            <div class="invalid-feedback">Selecciona al responsable.</div>
          </div>
          <div class="col-md-6">
            <label for="fechaper" class="form-label">Fecha de apertura</label>
            <input id="fechaper" name="fechaper" type="date" class="form-control" required>
            <div class="invalid-feedback">Obligatoria.</div>
          </div>
          <div class="col-md-6">
            <label for="estfic" class="form-label">Estado</label>
            <select id="estfic" name="estfic" class="form-select" required><option value="ABIERTA">Abierta</option><option value="CERRADA">Cerrada</option></select>
            <div class="invalid-feedback">Elige un estado.</div>
          </div>
          </div>
          <div class="mb-3">
            <label for="motfic" class="form-label">Motivo de consulta</label>
            <textarea id="motfic" name="motfic" class="form-control" rows="2" required></textarea>
            <div class="invalid-feedback">El motivo es obligatorio.</div>
          </div>
          <div class="mb-3">
            <label for="antfic" class="form-label">Antecedentes</label>
            <textarea id="antfic" name="antfic" class="form-control" rows="2"></textarea>
            <div class="invalid-feedback"></div>
          </div>
          <div class="mb-3">
            <label for="diagfic" class="form-label">Diagnóstico (se completa después)</label>
            <textarea id="diagfic" name="diagfic" class="form-control" rows="2"></textarea>
            <div class="invalid-feedback"></div>
          </div>
          <div class=" ">
            <label for="planfic" class="form-label">Plan de tratamiento (se completa después)</label>
            <textarea id="planfic" name="planfic" class="form-control" rows="2"></textarea>
            <div class="invalid-feedback"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/crud.js"></script>
  <script src="../js/sesion.js"></script>
  <script src="../js/fichas.js"></script>
</body>
</html>
