<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | UDH Becas y Bienestar</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
  <link href="css/flujo.css" rel="stylesheet">
  <script src="js/theme.js"></script>
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand">
      <img src="img/udhescudo.png" alt="Escudo de la Universidad de Huánuco">
      <div>
        <b>UDH</b>
        <small>Universidad de Huánuco</small>
      </div>
    </div>
    <h1>Iniciar sesión</h1>
    <p class="text-muted">Sistema de gestión de becas y bienestar universitario.</p>

    <form id="formulario" novalidate>
      <div id="alertas"></div>
      <div class="mb-3">
        <label for="nomusu" class="form-label">Usuario</label>
        <input id="nomusu" name="nomusu" class="form-control" maxlength="30" autocomplete="username" autofocus required>
        <div class="form-text">Los estudiantes entran con su DNI.</div>
        <div class="invalid-feedback">Escribe tu usuario.</div>
      </div>
      <div class="mb-3">
        <label for="clausu" class="form-label">Contraseña</label>
        <div class="input-group">
          <input id="clausu" name="clausu" type="password" class="form-control" maxlength="100" autocomplete="current-password" required>
          <button id="verclave" type="button" class="btn btn-ghost" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
          <div class="invalid-feedback">Escribe tu contraseña.</div>
        </div>
      </div>
      <button id="entrar" type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Entrar</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
